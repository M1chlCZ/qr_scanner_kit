name: qr_scanner_kit
description: >-
  A ready-to-use QR scanner screen and viewfinder overlay built on
  mobile_scanner, with torch, camera switching, and a simple scan callback.
version: 0.4.0
repository: https://github.com/M1chlCZ/qr_scanner_kit
issue_tracker: https://github.com/M1chlCZ/qr_scanner_kit/issues
topics:
  - widget
  - qr
  - scanner
  - barcode
  - camera
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
